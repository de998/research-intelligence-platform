
version: 2

models:
  - name: project_observations
    description: "Historical project-stage observations with source provenance"

    columns:
      - name: observation_id
        data_tests:
          - unique
          - not_null

      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('projects')
                field: project_id

      - name: source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sources')
                field: source_id

      - name: observation_as_of_date
        data_tests:
          - not_null

      - name: observed_project_stage
        data_tests:
          - not_null

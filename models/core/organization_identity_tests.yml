
version: 2

models:
  - name: stg_organization_identity_decisions
    columns:
      - name: alias_org_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('organizations')
                field: org_id

      - name: canonical_org_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('organizations')
                field: org_id

      - name: evidence_source_id
        data_tests:
          - relationships:
              arguments:
                to: ref('sources')
                field: source_id

      - name: decision_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['proposed', 'verified']

  - name: organization_identity_map
    columns:
      - name: incoming_org_id
        data_tests:
          - unique
          - not_null

      - name: canonical_org_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('organizations')
                field: org_id

  - name: org_mentions_resolved
    columns:
      - name: mention_id
        data_tests:
          - unique
          - not_null

      - name: canonical_org_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('organizations')
                field: org_id


version: 2

models:
  - name: project_metrics
    description: "Numeric research claims with provenance and measurement classifications"

    columns:
      - name: metric_id
        data_tests:
          - unique
          - not_null

      - name: claim_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('claims')
                field: claim_id

      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('projects')
                field: project_id

      - name: source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sources')
                field: source_id

      - name: metric_value
        data_tests:
          - not_null

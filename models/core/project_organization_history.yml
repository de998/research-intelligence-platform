
version: 2

models:
  - name: project_organization_history
    description: "Source-backed project-organization evidence history"

    columns:
      - name: history_record_id
        data_tests:
          - unique
          - not_null

      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('projects')
                field: project_id

      - name: canonical_org_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('organizations')
                field: org_id

      - name: source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sources')
                field: source_id

  - name: project_organization_review_queue
    description: "Reported organization relationships requiring review"

    columns:
      - name: history_record_id
        data_tests:
          - unique
          - not_null
